version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapipass
      POSTGRES_DB: hapi
    volumes:
      - hapi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - carelink-network

  fhir:
    image: hapiproject/hapi:v7.6.1
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapipass
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      HAPI_FHIR_BULK_EXPORT_ENABLED: "true"
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: "0"
    volumes:
      - ./fhir/application.yaml:/data/hapi/application.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - carelink-network

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - FRONTEND_URL=http://localhost:5173
      - CONNECT_MONGO=false
      - FHIR_SERVER_URL=http://fhir:8080/fhir
      - FHIR_PUBLIC_URL=http://localhost:8080/fhir
      - FHIR_POSTGRES_URL=postgres://hapi:hapipass@postgres:5432/hapi
      - SMART_CLIENT_ID=carelink-patient-access
      - SMART_CLIENT_SECRET=carelink-smart-secret
      - JWT_SECRET=carelink-dev-jwt-secret-change-me
      - JWT_EXPIRES_IN=24h
    depends_on:
      - fhir
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./data:/app/data
    networks:
      - carelink-network

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
      - VITE_FHIR_SERVER_URL=http://localhost:8080/fhir
      - VITE_SMART_CLIENT_ID=carelink-patient-access
      - VITE_OAUTH_AUTHORIZE_URL=http://localhost:3000/oauth/authorize
      - VITE_OAUTH_REDIRECT_URI=http://localhost:5173/smart/callback
    depends_on:
      - backend
    networks:
      - carelink-network

volumes:
  hapi_pg_data:

networks:
  carelink-network:
    driver: bridge
